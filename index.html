  function resumeRun() {
    state.screen = 'play';
    uiEl.classList.remove('active', 'dim');
    mapDrawerEl.classList.remove('visible');

    const touchHtml = state.showTouch ? `
      <div class="touch-cluster-left">
        <button class="pad-btn" id="pad_left">◀</button>
        <button class="pad-btn" id="pad_right">▶</button>
        <button class="pad-btn" id="pad_down">▼</button>
      </div>
      <div class="touch-cluster-right">
        <button class="pad-btn" id="pad_dash">⚡DASH</button>
        <button class="pad-btn" id="pad_act">${state.char === 'gear' ? '🔥ACT' : '⛏️ACT'}</button>
        <button class="pad-btn gold" id="pad_jump">▲JUMP</button>
      </div>
    ` : '';

    cornerEl.innerHTML = `
      <button class="hud-btn" style="top:10px; right:14px;" onclick="window.__game.pauseRun()">⏸</button>
      ${touchHtml}
    `;

    if (state.showTouch) bindTouchControls();
  }

  function bindTouchControls() {
    const bindHold = (id, keyName, onPress) => {
      const el = document.getElementById(id);
      if (!el) return;
      const down = (e) => {
        e.preventDefault();
        e.stopPropagation();
        el.classList.add('pressed');
        if (keyName) keys[keyName] = true;
        if (onPress) onPress();
      };
      const up = (e) => {
        e.preventDefault();
        el.classList.remove('pressed');
        if (keyName) keys[keyName] = false;
        if (keyName === 'jumpHeld') releaseJump();
      };
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointerleave', up);
      el.addEventListener('pointercancel', up);
    };

    bindHold('pad_left', 'left');
    bindHold('pad_right', 'right');
    bindHold('pad_down', 'down', () => triggerDownAction());
    bindHold('pad_jump', 'jumpHeld', () => triggerJump());
    bindHold('pad_dash', null, () => triggerDash());
    bindHold('pad_act', null, () => triggerSpecialAction());
  }

  function pauseRun() {
    if (state.screen !== 'play') return;
    AudioSys.sfxClick();
    keys.left = keys.right = keys.down = keys.jumpHeld = false;
    state.screen = 'modal';
    uiEl.classList.add('active', 'dim');
    uiEl.innerHTML = `
      <div class="stone-panel">
        <h2>${T('pauseTitle')}</h2>
        <button class="btn wide" onclick="window.__game.resumeRun()">${T('resume')}</button>
        <button class="btn sec wide" onclick="window.__game.launchRun(${run.worldIdx})">${T('tryAgain')}</button>
        <button class="btn sec wide" onclick="window.__game.openWorldMap()">${T('toMap')}</button>
      </div>
    `;
  }

  function spawnParticles(x, y, color, count = 8, spread = 6) {
    for (let i = 0; i < count; i++) {
      run.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * spread,
        vy: -Math.random() * 5 - 1,
        life: 20 + Math.random() * 14,
        color
      });
    }
  }

  // --------------------------------------------------------------------------
  // PLAYER MOVEMENT ACTIONS (Jump, Double Jump, Wall-Jump, Slide, Slam, Dash, Action)
  // --------------------------------------------------------------------------
  function triggerJump() {
    if (state.screen !== 'play') return;
    const p = run.player;
    const exp = EXPLORERS[state.char];
    const windPenalty = (run.worldIdx === 3 && run.windPhase > 0.45) ? 1.0 : 0;

    if (p.grounded || p.coyoteTimer > 0) {
      p.vy = -(exp.jumpPower - windPenalty);
      p.grounded = false;
      p.coyoteTimer = 0;
      p.slideTimer = 0;
      p.crouching = false;
      p.slamming = false;
      p.usedDoubleJump = false;
      AudioSys.sfxJump();
      spawnParticles(p.x, p.y, '#e9d5ff', 6);
    } else if (p.onWall !== 0) {
      p.vx = -p.onWall * 8.6;
      p.vy = -(exp.jumpPower * 0.94);
      p.facing = -p.onWall;
      p.onWall = 0;
      p.slamming = false;
      p.usedDoubleJump = false;
      AudioSys.sfxWallJump();
      spawnParticles(p.x, p.y - 24, '#ffd740', 10);
    } else if (!p.usedDoubleJump) {
      p.vy = -(exp.doubleJumpPower - windPenalty);
      p.usedDoubleJump = true;
      p.slamming = false;
      p.airBoostFlash = 16;
      AudioSys.sfxDoubleJump();
      spawnParticles(
        p.x,
        p.y - 12,
        state.char === 'gear' ? '#ff9800' : '#c084fc',
        12
      );
    } else {
      p.jumpBuffer = 8;
    }
  }

  function releaseJump() {
    const p = run.player;
    if (p.vy < -4.5 && !p.slamming) {
      p.vy *= 0.55;
    }
  }

  function triggerDownAction() {
    if (state.screen !== 'play') return;
    const p = run.player;

    if (p.grounded) {
      if (Math.abs(p.vx) > 2.2 && p.slideTimer <= 0) {
        p.slideTimer = run.worldIdx === 2 ? 56 : 36;
        p.vx = p.facing * (run.worldIdx === 2 ? 10.5 : 8.8);
        AudioSys.sfxSlide();
        spawnParticles(p.x, p.y, run.worldIdx === 2 ? '#b3e5fc' : '#e9d5ff', 8);
      } else {
        p.crouching = true;
      }
    } else if (!p.slamming) {
      p.slamming = true;
      p.dashTimer = 0;
      p.vx *= 0.35;
      p.vy = 18.5;
      AudioSys.sfxDash();
    }
  }

  function triggerDash() {
    if (state.screen !== 'play') return;
    const p = run.player;
    if (p.dashCooldown > 0 || p.dashTimer > 0) return;

    p.dashTimer = 14;
    p.dashCooldown = 48;
    p.slamming = false;
    p.slideTimer = 0;
    p.crouching = false;
    p.vy = 0;
    p.vx = p.facing * (state.char === 'gear' ? 13.5 : 12.2);
    AudioSys.sfxDash();
    spawnParticles(
      p.x,
      p.y - 26,
      state.char === 'gear' ? '#ff6d00' : '#a855f7',
      14,
      8
    );
  }

  function triggerSpecialAction() {
    if (state.screen !== 'play') return;
    const p = run.player;
    if (p.actionCooldown > 0) return;

    p.actionTimer = 14;
    p.actionCooldown = 24;
    AudioSys.sfxAction();
    spawnParticles(
      p.x + p.facing * 26,
      p.y - 28,
      state.char === 'gear' ? '#ffd740' : '#e879f9',
      10,
      7
    );
  }

  function triggerLandingSlamShockwave(x, y) {
    AudioSys.sfxSlam();
    const isGear = state.char === 'gear';
    run.shockwaves.push({
      x, y,
      radius: 14,
      maxRadius: isGear ? 95 : 125,
      color: isGear ? '#ff9800' : '#c084fc',
      life: 16
    });
    spawnParticles(x, y, isGear ? '#ff6d00' : '#c084fc', 16, 9);

    const reach = isGear ? 85 : 115;
    for (const it of run.items) {
      if (it.smashed) continue;
      const sx = it.x + (it.offsetX || 0);
      const box = getObstacleBox(it, sx);
      if (box.breakable && Math.abs((box.x + box.w / 2) - x) < reach && Math.abs((box.y + box.h) - y) < 60) {
        it.smashed = true;
        AudioSys.sfxSmash();
        spawnParticles(box.x + box.w / 2, box.y + box.h / 2, '#d1d5db', 12);
      }
    }
  }

  function getObstacleBox(it, x) {
    switch (it.type) {
      case 'rock':       return { x, y: GROUND_Y - 36, w: 38, h: 36, breakable: true };
      case 'hurdle':     return { x, y: GROUND_Y - 46, w: 32, h: 46, breakable: true };
      case 'shroom':     return { x, y: GROUND_Y - 28, w: 44, h: 28 };
      case 'cone':       return { x, y: GROUND_Y - 40, w: 34, h: 40, breakable: true };
      case 'banner':     return { x, y: GROUND_Y - 104, w: 76, h: 52 };
      case 'drone':      return { x, y: GROUND_Y - 94 + Math.sin(run.anim * 2.5 + it.x) * 10, w: 48, h: 28, breakable: true };
      case 'pad':        return { x, y: GROUND_Y - 9, w: 66, h: 9 };
      case 'icespike':   return { x, y: GROUND_Y - 46, w: 36, h: 46, breakable: true };
      case 'snowball':   return { x, y: GROUND_Y - 38, w: 38, h: 38, breakable: true };
      case 'icicle':     return { x, y: it.dropY, w: 34, h: 46 };
      case 'cactus':     return { x, y: GROUND_Y - 64, w: 32, h: 64, breakable: true };
      case 'tumbleweed': return { x, y: GROUND_Y - 34 - Math.abs(Math.sin(run.anim * 2.1 + it.x)) * 38, w: 32, h: 32, breakable: true };
      case 'sand':       return { x, y: GROUND_Y - 6, w: 96, h: 14 };
      case 'orb':        return { x, y: GROUND_Y - 72 + Math.sin(run.anim * 2 + it.x) * 34, w: 32, h: 32 };
      case 'laser':      return { x, y: GROUND_Y - 104, w: 72, h: 50 };
      default:           return { x, y: GROUND_Y - 36, w: 36, h: 36 };
    }
  }

  function boxesOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // --------------------------------------------------------------------------
  // QUIZ CHECKPOINT, FAIL & STAGE COMPLETION (TRIGGERS ENDING AT 5/5 RELICS)
  // --------------------------------------------------------------------------
  function triggerCheckpointQuiz() {
    keys.left = keys.right = keys.down = keys.jumpHeld = false;
    state.screen = 'modal';
    cornerEl.innerHTML = '';
    uiEl.classList.add('active', 'dim');
    const w = WORLDS[run.worldIdx];
    const qText = w.quiz.q[state.lang];
    const opts = w.quiz.a[state.lang];

    uiEl.innerHTML = `
      <div class="stone-panel">
        <div class="subtitle">${T('checkpointSub')}</div>
        <h2>${T('checkpointTitle')}</h2>
        <p style="font-size:1.05em;font-weight:bold;color:#fff;">${qText}</p>
        ${opts.map((opt, i) => `
          <button class="btn sec quiz-opt" onclick="window.__game.answerQuiz(${i})">${String.fromCharCode(65 + i)}. ${opt}</button>
        `).join('')}
      </div>
    `;
  }

  function answerQuiz(idx) {
    const w = WORLDS[run.worldIdx];
    if (idx === w.quiz.c) {
      AudioSys.sfxCorrect();
      run.frag++;
      run.boostTimer = 110;
      state.ach.first = true;
      uiEl.innerHTML = `
        <div class="stone-panel">
          <h2>${T('correctTitle')}</h2>
          <p>${w.quiz.e[state.lang]}</p>
          <button class="btn wide" onclick="window.__game.resumeRun()">${T('continueRun')}</button>
        </div>
      `;
    } else {
      AudioSys.sfxHurt();
      state.perfectQuiz = false;
      uiEl.innerHTML = `
        <div class="stone-panel">
          <h2 style="color:#f87171;">${T('wrongTitle')}</h2>
          <p>${w.quiz.e[state.lang]}</p>
          <button class="btn wide" onclick="window.__game.triggerCheckpointQuiz()">${T('tryAgain')}</button>
        </div>
      `;
    }
  }

  function handleStageFail() {
    keys.left = keys.right = keys.down = keys.jumpHeld = false;
    AudioSys.sfxHurt();
    state.screen = 'modal';
    cornerEl.innerHTML = '';
    uiEl.classList.add('active', 'dim');
    uiEl.innerHTML = `
      <div class="stone-panel">
        <h2 style="color:#f87171;">${T('outOfHpTitle')}</h2>
        <p>${T('outOfHpBody')}</p>
        <button class="btn wide" onclick="window.__game.launchRun(${run.worldIdx})">${T('tryAgain')}</button>
        <button class="btn sec wide" onclick="window.__game.openWorldMap()">${T('toMap')}</button>
      </div>
    `;
  }

  function handleStageFinish() {
    keys.left = keys.right = keys.down = keys.jumpHeld = false;
    state.screen = 'modal';
    cornerEl.innerHTML = '';
    uiEl.classList.add('active', 'dim');

    if (run.frag < 5) {
      AudioSys.sfxHurt();
      run.player.x -= 60;
      uiEl.innerHTML = `
        <div class="stone-panel">
          <h2>${T('notEnoughTitle')} (${run.frag}/5)</h2>
          <p>${T('notEnoughBody')}</p>
          <button class="btn wide" onclick="window.__game.resumeRun()">${T('continueRun')}</button>
          <button class="btn sec wide" onclick="window.__game.launchRun(${run.worldIdx})">${T('tryAgain')}</button>
        </div>
      `;
      return;
    }

    const wasIncomplete = state.relics.length < 5;
    if (!state.relics.includes(run.worldIdx)) state.relics.push(run.worldIdx);
    if (run.worldIdx === state.unlockedWorld && state.unlockedWorld < 4) {
      state.unlockedWorld++;
      state.selectedWorld = state.unlockedWorld;
    }

    state.ach.first = true;
    if (!run.tookDamage) state.ach.clean = true;
    state.charsWon[state.char] = true;
    if (state.charsWon.gear && state.charsWon.crag) state.ach.duo = true;
    if (state.relics.length >= 5) {
      state.ach.all = true;
      if (state.perfectQuiz) state.ach.brain = true;
    }
    saveProgress();

    // Automatically launch the 4-Scene Animated Ending Sequence when all 5 Relics are collected!
    if (state.relics.length >= 5 && (wasIncomplete || run.worldIdx === 4)) {
      startEnding();
      return;
    }

    AudioSys.sfxRelic();
    uiEl.innerHTML = `
      <div class="stone-panel">
        <div class="badge-pill">RELIC ${state.relics.length} / 5</div>
        <h2>${T('relicTitle')}</h2>
        <p><b>${WORLDS[run.worldIdx].name}</b> ${run.tookDamage ? '' : '— ★ ' + ACHIEVEMENTS_LIST[1].title[state.lang]}</p>
        <button class="btn wide" onclick="window.__game.openWorldMap()">${T('nextIslandBtn')}</button>
      </div>
    `;
  }

  // --------------------------------------------------------------------------
  // 10. PHYSICS, SOLID BLOCK COLLISIONS & CAMERA TRACKING
  // --------------------------------------------------------------------------
  function updateGameplay(dt) {
    const w = WORLDS[run.worldIdx];
    const p = run.player;
    const exp = EXPLORERS[state.char];

    if (run.invuln > 0) run.invuln = Math.max(0, run.invuln - dt);
    if (run.boostTimer > 0) run.boostTimer = Math.max(0, run.boostTimer - dt);
    if (p.slideTimer > 0) p.slideTimer = Math.max(0, p.slideTimer - dt);
    if (p.dashTimer > 0) p.dashTimer = Math.max(0, p.dashTimer - dt);
    if (p.dashCooldown > 0) p.dashCooldown = Math.max(0, p.dashCooldown - dt);
    if (p.actionTimer > 0) p.actionTimer = Math.max(0, p.actionTimer - dt);
    if (p.actionCooldown > 0) p.actionCooldown = Math.max(0, p.actionCooldown - dt);
    if (p.airBoostFlash > 0) p.airBoostFlash = Math.max(0, p.airBoostFlash - dt);

    run.windPhase = run.worldIdx === 3 ? Math.sin(p.x * 0.0022) : 0;
    run.finalSprint = (run.worldIdx === 4 && p.x > run.length * 0.72);

    let maxSpd = exp.maxSpeed;
    if (run.boostTimer > 0) maxSpd += 3.0;
    if (run.finalSprint) maxSpd += 1.6;
    if (run.inQuicksand) maxSpd *= 0.56;

    const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

    if (p.dashTimer > 0) {
      p.vx = p.facing * (state.char === 'gear' ? 13.5 : 12.2);
      p.vy = 0;
      if (((p.dashTimer * 2) | 0) % 2 === 0) {
        spawnParticles(p.x - p.facing * 12, p.y - 24, state.char === 'gear' ? '#ff9800' : '#c084fc', 2, 3);
      }
    } else if (p.slideTimer > 0) {
      const slideFriction = run.worldIdx === 2 ? 0.992 : 0.955;
      p.vx *= Math.pow(slideFriction, dt);
      if (Math.abs(p.vx) < 2.2) p.slideTimer = 0;
    } else {
      if (moveDir !== 0) {
        p.facing = moveDir;
        p.crouching = false;
        const accel = p.grounded ? 0.85 : 0.58;
        let targetVx = moveDir * maxSpd;
        if (run.worldIdx === 3 && run.windPhase > 0.45 && moveDir > 0) targetVx -= 1.5;
        p.vx += (targetVx - p.vx) * Math.min(1, accel * 0.25 * dt);
      } else {
        const friction = (p.grounded && run.worldIdx === 2) ? 0.92 : (p.grounded ? 0.78 : 0.92);
        p.vx *= Math.pow(friction, dt);
        if (Math.abs(p.vx) < 0.15) p.vx = 0;
        p.crouching = p.grounded && keys.down;
      }
    }

    p.prevX = p.x;
    p.x += p.vx * dt;
    p.x = Math.max(40, Math.min(run.length - 120, p.x));
    p.onWall = 0;

    const pHalfW = 15;
    const pHeight = (p.slideTimer > 0 || p.crouching) ? 32 : 56;

    for (const b of run.blocks) {
      const pRect = { x: p.x - pHalfW, y: p.y - pHeight + 2, w: pHalfW * 2, h: pHeight - 4 };
      if (boxesOverlap(pRect, b)) {
        if (p.prevX + pHalfW <= b.x + 6) {
          p.x = b.x - pHalfW;
          p.vx = 0;
          if (!p.grounded) p.onWall = 1;
        } else if (p.prevX - pHalfW >= b.x + b.w - 6) {
          p.x = b.x + b.w + pHalfW;
          p.vx = 0;
          if (!p.grounded) p.onWall = -1;
        }
      }
    }

    p.prevY = p.y;
    if (p.dashTimer <= 0) {
      const grav = w.grav + ((run.worldIdx === 3 && run.windPhase > 0.45) ? 0.1 : 0);
      p.vy += grav * dt;

      if (p.onWall !== 0 && p.vy > 2.4 && !p.slamming) {
        p.vy = 2.4;
        if (((run.anim * 4) | 0) % 2 === 0) {
          spawnParticles(p.x + p.onWall * 14, p.y - 24, '#e5e7eb', 1, 2);
        }
      }
      p.y += p.vy * dt;
    }

    if (p.grounded) p.coyoteTimer = 7;
    else p.coyoteTimer = Math.max(0, p.coyoteTimer - dt);

    p.grounded = false;

    if (p.y >= GROUND_Y) {
      p.y = GROUND_Y;
      if (p.slamming) {
        triggerLandingSlamShockwave(p.x, GROUND_Y);
        p.slamming = false;
      }
      p.vy = 0;
      p.grounded = true;
      p.usedDoubleJump = false;
    }

    for (const b of run.blocks) {
      const pRect = { x: p.x - pHalfW + 2, y: p.y - pHeight, w: (pHalfW - 2) * 2, h: pHeight };
      if (boxesOverlap(pRect, b)) {
        if (p.vy >= 0 && p.prevY <= b.y + 12) {
          p.y = b.y;
          if (p.slamming) {
            triggerLandingSlamShockwave(p.x, b.y);
            p.slamming = false;
          }
          p.vy = 0;
          p.grounded = true;
          p.usedDoubleJump = false;
        } else if (p.vy < 0 && p.prevY - pHeight >= b.y + b.h - 12) {
          p.y = b.y + b.h + pHeight;
          p.vy = 0;
        }
      }
    }

    if (p.jumpBuffer > 0) {
      p.jumpBuffer = Math.max(0, p.jumpBuffer - dt);
      if (p.grounded) {
        p.jumpBuffer = 0;
        triggerJump();
      }
    }

    run.anim += (0.04 + Math.abs(p.vx) * 0.032) * dt;
    run.inQuicksand = false;

    const curHeight = (p.slideTimer > 0 || p.crouching) ? 32 : 56;
    const playerBox = { x: p.x - 14, y: p.y - curHeight + 3, w: 28, h: curHeight - 5 };
    const attackBox = p.actionTimer > 0 ? {
      x: p.facing > 0 ? p.x + 8 : p.x - 58,
      y: p.y - 54,
      w: 50,
      h: 48
    } : null;

    for (const it of run.items) {
      if (it.smashed) continue;
      if (it.squish > 0) it.squish = Math.max(0, it.squish - dt);

      if (it.type === 'snowball' && Math.abs(it.x - p.x) < W * 0.7) {
        it.offsetX -= 2.2 * dt;
      }
      if (it.type === 'icicle' && Math.abs((it.x) - p.x) < 220) {
        it.dropY = Math.min(GROUND_Y - 96, it.dropY + 8.5 * dt);
      }

      const wx = it.x + (it.offsetX || 0);

      if (it.type === 'frag') {
        if (!it.collected && boxesOverlap(playerBox, { x: wx - 16, y: it.y - 18, w: 32, h: 36 })) {
          it.collected = true;
          run.frag++;
          state.ach.first = true;
          AudioSys.sfxGem();
          spawnParticles(wx, it.y, '#e879f9', 14);
        }
        continue;
      }

      const box = getObstacleBox(it, wx);

      if (it.type === 'shroom') {
        if (boxesOverlap(playerBox, box) && p.vy >= 0) {
          const slamBonus = p.slamming ? -3.5 : 0;
          p.y = box.y;
          p.vy = -19.2 + slamBonus;
          p.grounded = false;
          p.slamming = false;
          p.usedDoubleJump = false;
          it.squish = 14;
          AudioSys.sfxBounce();
          spawnParticles(wx + 20, box.y, '#ff5252', 12);
        }
        continue;
      }

      if (it.type === 'pad') {
        if (boxesOverlap(playerBox, box) && p.grounded) {
          if (run.boostTimer <= 15) AudioSys.sfxBoost();
          run.boostTimer = 85;
          spawnParticles(p.x, GROUND_Y, '#ffd740', 6);
        }
        continue;
      }

      if (it.type === 'sand') {
        if (boxesOverlap(playerBox, box) && p.grounded) {
          run.inQuicksand = true;
        }
        continue;
      }

      const cragCharging = (state.char === 'crag' && p.dashTimer > 0);
      if (box.breakable && ((attackBox && boxesOverlap(attackBox, box)) || (cragCharging && boxesOverlap(playerBox, box)))) {
        it.smashed = true;
        AudioSys.sfxSmash();
        spawnParticles(box.x + box.w / 2, box.y + box.h / 2, state.char === 'gear' ? '#ff9800' : '#c084fc', 14, 8);
        continue;
      }

      const gearDashing = (state.char === 'gear' && p.dashTimer > 0);
      if (run.invuln <= 0 && !gearDashing && boxesOverlap(playerBox, box)) {
        run.hp--;
        run.tookDamage = true;
        run.invuln = exp.invFrames;
        p.vx = -p.facing * 5.5;
        p.vy = -7.5;
        p.grounded = false;
        p.slamming = false;
        AudioSys.sfxHurt();
        spawnParticles(p.x, p.y - 28, '#ff4d6d', 14);
        if (run.hp <= 0) {
          handleStageFail();
          return;
        }
      }
    }

    for (let i = run.particles.length - 1; i >= 0; i--) {
      const pt = run.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 0.25 * dt;
      pt.life -= dt;
      if (pt.life <= 0) run.particles.splice(i, 1);
    }

    for (let i = run.shockwaves.length - 1; i >= 0; i--) {
      const sw = run.shockwaves[i];
      sw.radius += (sw.maxRadius - sw.radius) * 0.28 * dt;
      sw.life -= dt;
      if (sw.life <= 0) run.shockwaves.splice(i, 1);
    }

    const targetCam = Math.max(0, Math.min(run.length - W, p.x - W * 0.34 + p.facing * 65));
    run.camX += (targetCam - run.camX) * Math.min(1, 0.14 * dt);

    if (!run.quizShown && p.x >= run.length * 0.5) {
      run.quizShown = true;
      triggerCheckpointQuiz();
      return;
    }

    if (Math.abs(p.x - (run.length - 220)) < 38 && Math.abs(p.y - GROUND_Y) < 60) {
      handleStageFinish();
    }
  }

  // --------------------------------------------------------------------------
  // 11. WORLD RENDERING (BACKGROUND, BLOCKS, ENTITIES, PLAYER & HUD)
  // --------------------------------------------------------------------------
  function drawWorldBackground() {
    const w = WORLDS[run.worldIdx];
    const o = run.camX;

    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, w.sky[0]);
    grad.addColorStop(1, w.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = run.worldIdx === 4 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 250 - o * 0.08) % 1300 + 1300) % 1300 - 150;
      const cy = 44 + (i * 41) % 85;
      pxRect(ctx, cx, cy, 96, 18, ctx.fillStyle);
      pxRect(ctx, cx + 18, cy - 12, 54, 14, ctx.fillStyle);
    }

    const startIdx = Math.floor((o * 0.25) / 160);
    for (let i = 0; i < 8; i++) {
      const n = startIdx + i;
      const x = n * 160 - o * 0.25;
      const h = 72 + Math.abs(Math.sin(n * 11.7)) * 125;
      ctx.fillStyle = w.far;

      if (run.worldIdx === 0) {
        pxRect(ctx, x + 64, GROUND_Y - 58, 12, 58, '#6d4c41');
        pxRect(ctx, x + 34, GROUND_Y - 58 - h * 0.55, 72, h * 0.55, w.far);
        pxRect(ctx, x, GROUND_Y - 22, 160, 5, '#a67249');
        pxRect(ctx, x + 16, GROUND_Y - 28, 7, 28, '#8d5b3c');
        pxRect(ctx, x + 96, GROUND_Y - 28, 7, 28, '#8d5b3c');
      } else if (run.worldIdx === 1) {
        pxRect(ctx, x, GROUND_Y - h, 126, h, w.far);
        for (let wy = GROUND_Y - h + 14; wy < GROUND_Y - 18; wy += 26) {
          for (let wx = x + 14; wx < x + 110; wx += 28) {
            pxRect(ctx, wx, wy, 13, 13, '#ffd740');
          }
        }
        pxRect(ctx, x + 132, GROUND_Y - 64, 18, 38, '#7c3aed');
      } else if (run.worldIdx === 2) {
        ctx.beginPath();
        ctx.moveTo(x - 24, GROUND_Y);
        ctx.lineTo(x + 70, GROUND_Y - h - 38);
        ctx.lineTo(x + 164, GROUND_Y);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(x + 70, GROUND_Y - h - 38);
        ctx.lineTo(x + 44, GROUND_Y - h);
        ctx.lineTo(x + 96, GROUND_Y - h);
        ctx.fill();
      } else if (run.worldIdx === 3) {
        pxRect(ctx, x, GROUND_Y - h * 0.72, 114, h * 0.72, w.far);
        pxRect(ctx, x + 128, GROUND_Y - 58, 9, 58, '#2e7d32');
        pxRect(ctx, x + 119, GROUND_Y - 42, 9, 7, '#2e7d32');
        pxRect(ctx, x + 137, GROUND_Y - 35, 9, 7, '#2e7d32');
      } else {
        pxRect(ctx, x + 36, GROUND_Y - h, 42, h, w.far);
        pxRect(ctx, x + 28, GROUND_Y - h - 10, 58, 10, '#ede7f6');
        pxRect(ctx, x + 52, GROUND_Y - h + 14, 10, h - 22, 'rgba(255,215,64,0.5)');
      }
    }

    if (run.worldIdx === 0) {
      for (let i = 0; i < 7; i++) {
        const bx = ((i * 190 - o * 0.35 + Math.sin(run.anim + i) * 30) % W + W) % W;
        const by = 290 + Math.sin(run.anim * 2 + i) * 40;
        pxRect(ctx, bx, by, 5, 5, '#ffd740');
      }
    } else if (run.worldIdx === 2) {
      for (let i = 0; i < 50; i++) {
        const sx = ((i * 113 - o * 0.6 - run.anim * 25) % W + W) % W;
        const sy = (i * 61 + run.anim * 45) % H;
        pxRect(ctx, sx, sy, 3, 3, '#ffffff');
      }
    } else if (run.worldIdx === 3 && run.windPhase > 0.45) {
      for (let i = 0; i < 26; i++) {
        const sx = ((i * 149 - run.anim * 210) % W + W) % W;
        const sy = 70 + (i * 43) % 350;
        pxRect(ctx, sx, sy, 34, 2, 'rgba(255, 224, 163, 0.72)');
      }
    }

    pxRect(ctx, 0, GROUND_Y, W, H - GROUND_Y, w.ground);
    pxRect(ctx, 0, GROUND_Y, W, 10, w.grass);
    for (let i = 0; i < 14; i++) {
      const gx = i * 80 - (((o % 80) + 80) % 80);
      pxRect(ctx, gx, GROUND_Y + 42, 42, 5, w.grass);
    }
  }

  function drawWorldEntities() {
    const o = run.camX;

    for (const b of run.blocks) {
      const sx = b.x - o;
      if (sx + b.w < -60 || sx > W + 60) continue;

      if (b.style === 'ruin') {
        pxRect(ctx, sx, b.y, b.w, b.h, '#6b6385');
        pxRect(ctx, sx, b.y, b.w, 6, '#4caf50');
        pxRect(ctx, sx + 4, b.y + 8, b.w - 8, 4, '#948da8');
      } else if (b.style === 'city') {
        pxRect(ctx, sx, b.y, b.w, b.h, '#4c1d95');
        pxRect(ctx, sx, b.y, b.w, 6, '#ffd740');
      } else if (b.style === 'ice') {
        pxRect(ctx, sx, b.y, b.w, b.h, '#7dd3fc');
        pxRect(ctx, sx, b.y, b.w, 6, '#ffffff');
      } else if (b.style === 'desert') {
        pxRect(ctx, sx, b.y, b.w, b.h, '#c8693a');
        pxRect(ctx, sx, b.y, b.w, 6, '#f59e0b');
      } else {
        pxRect(ctx, sx, b.y, b.w, b.h, '#7e57c2');
        pxRect(ctx, sx, b.y, b.w, 5, '#ede7f6');
        pxRect(ctx, sx + 8, b.y + 9, b.w - 16, 3, '#ffd740');
      }
    }

    const flagX = run.length * 0.5 - o;
    if (flagX > -80 && flagX < W + 80) {
      pxRect(ctx, flagX, GROUND_Y - 108, 5, 108, '#e5e7eb');
      pxRect(ctx, flagX + 5, GROUND_Y - 108, 42, 26, '#ffd740');
      ctx.fillStyle = '#1e1042';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('QUIZ', flagX + 26, GROUND_Y - 90);
    }

    const endX = run.length - 220 - o;
    if (endX > -120 && endX < W + 120) {
      pxRect(ctx, endX - 28, GROUND_Y - 26, 56, 26, '#8b5cf6');
      pxRect(ctx, endX - 34, GROUND_Y - 32, 68, 8, '#c4b5fd');
      drawGoldenRelic(ctx, endX, GROUND_Y - 62, run.anim, 1.15);
    }

    for (const it of run.items) {
      if (it.smashed) continue;
      const wx = it.x + (it.offsetX || 0);
      const sx = wx - o;
      if (sx < -220 || sx > W + 90) continue;

      if (it.type === 'frag') {
        if (!it.collected) drawCrystalFragment(ctx, sx, it.y, run.anim);
        continue;
      }

      const r = getObstacleBox(it, sx);

      switch (it.type) {
        case 'shroom': {
          const sq = it.squish > 0 ? 7 : 0;
          pxRect(ctx, r.x + 14, r.y + 12 + sq, 16, 16 - sq, '#f5e6c8');
          pxRect(ctx, r.x, r.y + sq, r.w, 15, '#ff3d5a');
          pxRect(ctx, r.x + 7, r.y + 3 + sq, 7, 6, '#ffffff');
          pxRect(ctx, r.x + 28, r.y + 4 + sq, 7, 5, '#ffffff');
          break;
        }
        case 'hurdle':
          pxRect(ctx, r.x + 3, r.y, 6, r.h, '#78350f');
          pxRect(ctx, r.x + 23, r.y, 6, r.h, '#78350f');
          pxRect(ctx, r.x, r.y + 6, r.w, 9, '#f59e0b');
          pxRect(ctx, r.x, r.y + 24, r.w, 9, '#f59e0b');
          break;
        case 'pad':
          pxRect(ctx, r.x, r.y, r.w, r.h, '#ff9800');
          pxRect(ctx, r.x + 8, r.y + 2, 14, 4, ((run.anim * 4) | 0) % 2 ? '#ffffff' : '#ffd740');
          pxRect(ctx, r.x + 28, r.y + 2, 14, 4, ((run.anim * 4) | 0) % 2 ? '#ffd740' : '#ffffff');
          pxRect(ctx, r.x + 48, r.y + 2, 12, 4, '#ffffff');
          break;
        case 'cone':
          pxRect(ctx, r.x + 4, r.y, r.w - 8, r.h, '#ff6d00');
          pxRect(ctx, r.x + 6, r.y + 10, r.w - 12, 7, '#ffffff');
          pxRect(ctx, r.x + 2, r.y + 25, r.w - 4, 7, '#ffffff');
          break;
        case 'drone':
          pxRect(ctx, r.x + 6, r.y + 7, r.w - 12, 15, '#334155');
          pxRect(ctx, r.x, r.y + 2, r.w, 4, '#93c5fd');
          pxRect(ctx, r.x + 20, r.y + 11, 8, 6, ((run.anim * 5) | 0) % 2 ? '#ef4444' : '#00e5ff');
          break;
        case 'banner':
          pxRect(ctx, r.x + 12, 0, 4, r.y, '#4c1d95');
          pxRect(ctx, r.x + r.w - 16, 0, 4, r.y, '#4c1d95');
          pxRect(ctx, r.x, r.y, r.w, r.h, '#6d28d9');
          pxRect(ctx, r.x + 5, r.y + 5, r.w - 10, 7, '#ffd740');
          break;
        case 'snowball':
          ctx.fillStyle = '#e0f2fe';
          ctx.beginPath(); ctx.arc(r.x + 19, r.y + 19, 19, 0, Math.PI * 2); ctx.fill();
          pxRect(ctx, r.x + 11 + Math.cos(run.anim * 3) * 6, r.y + 13 + Math.sin(run.anim * 3) * 6, 7, 7, '#7dd3fc');
          break;
        case 'icicle':
          pxRect(ctx, r.x + 14, 0, 6, r.y, '#7dd3fc');
          ctx.fillStyle = '#bae6fd';
          ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.w, r.y); ctx.lineTo(r.x + r.w / 2, r.y + r.h); ctx.fill();
          break;
        case 'icespike':
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.moveTo(r.x, r.y + r.h); ctx.lineTo(r.x + 11, r.y); ctx.lineTo(r.x + 22, r.y + r.h); ctx.fill();
          ctx.fillStyle = '#bae6fd';
          ctx.beginPath(); ctx.moveTo(r.x + 15, r.y + r.h); ctx.lineTo(r.x + 25, r.y + 8); ctx.lineTo(r.x + 36, r.y + r.h); ctx.fill();
          break;
        case 'sand':
          pxRect(ctx, r.x, r.y, r.w, r.h, '#a16227');
          pxRect(ctx, r.x + 12, r.y + 3, r.w - 24, 7, '#78350f');
          break;
        case 'cactus':
          pxRect(ctx, r.x + 11, r.y, 10, r.h, '#2e7d32');
          pxRect(ctx, r.x + 2, r.y + 20, 9, 6, '#2e7d32');
          pxRect(ctx, r.x + 2, r.y + 10, 5, 14, '#2e7d32');
          pxRect(ctx, r.x + 21, r.y + 28, 9, 6, '#2e7d32');
          pxRect(ctx, r.x + 25, r.y + 16, 5, 16, '#2e7d32');
          break;
        case 'tumbleweed':
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(r.x + 16, r.y + 16, 14, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(r.x + 16, r.y + 16, 7, 0, Math.PI * 2); ctx.stroke();
          break;
        case 'orb':
          ctx.fillStyle = '#ff4081';
          ctx.beginPath(); ctx.arc(r.x + 16, r.y + 16, 16, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffd740';
          ctx.beginPath(); ctx.arc(r.x + 16, r.y + 16, 8, 0, Math.PI * 2); ctx.fill();
          break;
        case 'laser':
          pxRect(ctx, r.x + 8, 0, 4, r.y, '#4c1d95');
          pxRect(ctx, r.x + r.w - 12, 0, 4, r.y, '#4c1d95');
          pxRect(ctx, r.x, r.y + 18, r.w, 13, ((run.anim * 6) | 0) % 2 ? '#ff4081' : '#ffd740');
          break;
        default:
          pxRect(ctx, r.x, r.y, r.w, r.h, '#6b7280');
          pxRect(ctx, r.x + 4, r.y + 4, r.w - 8, 6, '#9ca3af');
      }
    }

    for (const sw of run.shockwaves) {
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(sw.x - o, sw.y - 4, sw.radius, 12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    const p = run.player;
    const screenPlayerX = p.x - o;
    if (!(run.invuln > 0 && ((run.invuln / 5) | 0) % 2 === 1)) {
      drawExplorer(ctx, state.char, screenPlayerX, p.y + (run.inQuicksand ? 6 : 0), run.anim, {
        sliding: p.slideTimer > 0,
        crouching: p.crouching,
        dashing: p.dashTimer > 0,
        slamming: p.slamming,
        wallSliding: p.onWall !== 0,
        actionTimer: p.actionTimer,
        airBoostFlash: p.airBoostFlash,
        scale: 1.05,
        facing: p.facing,
        moving: Math.abs(p.vx) > 0.4,
        torchLit: true
      });
    }

    for (const pt of run.particles) {
      pxRect(ctx, pt.x - o, pt.y, 5, 5, pt.color);
    }
  }

  function drawRunnerHUD() {
    const w = WORLDS[run.worldIdx];
    const exp = EXPLORERS[state.char];
    const p = run.player;

    pxRect(ctx, 0, 0, W, 42, 'rgba(15, 8, 36, 0.84)');
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd740';
    ctx.fillText(`${run.worldIdx + 1}/5 ${w.name}`, 14, 26);

    for (let i = 0; i < exp.hp; i++) {
      pxRect(ctx, 215 + i * 20, 13, 15, 15, i < run.hp ? '#ff4d6d' : '#4b2836');
    }

    ctx.fillStyle = '#e879f9';
    ctx.fillText(`◆ ${run.frag}/5`, 312, 26);

    const dashReady = Math.max(0, 1 - p.dashCooldown / 48);
    ctx.fillStyle = '#93c5fd';
    ctx.fillText('DASH [E]', 392, 26);
    pxRect(ctx, 476, 15, 54, 12, 'rgba(255,255,255,0.2)');
    pxRect(ctx, 476, 15, 54 * dashReady, 12, dashReady >= 1 ? '#00e5ff' : '#64748b');

    const progress = Math.min(1, p.x / (run.length - 220));
    pxRect(ctx, 545, 15, 140, 12, 'rgba(255,255,255,0.2)');
    pxRect(ctx, 545, 15, 140 * progress, 12, '#ffd740');

    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = state.relics.includes(i) ? '#ffd740' : 'rgba(255,255,255,0.22)';
      ctx.beginPath();
      ctx.arc(712 + i * 22, 21, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    let status = '';
    if (run.boostTimer > 0) status = '⚡ TURBO BOOST!';
    else if (run.finalSprint) status = '🔥 FINAL SPRINT!';
    else if (run.inQuicksand) status = '⏳ QUICKSAND!';
    else if (run.worldIdx === 3 && run.windPhase > 0.45) status = '💨 SANDSTORM WIND!';
    else if (run.worldIdx === 2 && p.slideTimer > 0) status = '❄️ ICE SLIDE!';
    else if (run.worldIdx === 4) status = '☁️ LOW GRAVITY';

    if (status) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd740';
      ctx.fillText(status, W - 18, 66);
    }
  }

  // --------------------------------------------------------------------------
  // 12. KEYBOARD & POINTER (M1) INPUT HANDLERS
  // --------------------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
      e.preventDefault();
    }

    if (state.screen === 'splash' || state.screen === 'cutscene' || state.screen === 'ending') {
      if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) advanceCutscene();
      if (!e.repeat && e.code === 'Escape') {
        if (state.screen === 'ending') showEndingCreditsModal();
        else openMainMenu();
      }
      return;
    }

    if (state.screen === 'map') {
      if (!e.repeat) {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') selectIslandOnMap((state.selectedWorld + 1) % 5);
        else if (e.code === 'ArrowLeft' || e.code === 'KeyA') selectIslandOnMap((state.selectedWorld + 4) % 5);
        else if ((e.code === 'Enter' || e.code === 'Space') && state.selectedWorld <= state.unlockedWorld) {
          prepareStage(state.selectedWorld);
        }
      }
      return;
    }

    if (state.screen === 'play') {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        if (!keys.down) triggerDownAction();
        keys.down = true;
      }
      if (!e.repeat) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
          keys.jumpHeld = true;
          triggerJump();
        }
        // Dash bound to E (plus Shift / J / Z fallbacks)
        if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyJ' || e.code === 'KeyZ') {
          triggerDash();
        }
        // Special Action fallback keys (M1 is primary via pointerdown)
        if (e.code === 'KeyK' || e.code === 'KeyX') {
          triggerSpecialAction();
        }
        if (e.code === 'Escape' || e.code === 'KeyP') {
          pauseRun();
        }
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      keys.jumpHeld = false;
      if (state.screen === 'play') releaseJump();
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const lx = ((e.clientX - rect.left) / rect.width) * W;
    const ly = ((e.clientY - rect.top) / rect.height) * H;

    if (state.screen === 'splash' || state.screen === 'cutscene' || state.screen === 'ending') {
      advanceCutscene();
      return;
    }

    if (state.screen === 'map') {
      for (let i = 0; i < WORLDS.length; i++) {
        const { x, y } = WORLDS[i].mapPos;
        if (Math.hypot(lx - x, ly - y) < 76) {
          selectIslandOnMap(i);
          return;
        }
      }
      return;
    }

    // M1 (Left Mouse Button / Primary Pointer) triggers Special Action during gameplay
    if (state.screen === 'play' && e.button === 0) {
      triggerSpecialAction();
    }
  });

  // --------------------------------------------------------------------------
  // 13. MAIN 60FPS ANIMATION LOOP
  // --------------------------------------------------------------------------
  let lastTimestamp = 0;

  function frame(ts) {
    const dtSec = Math.min((ts - lastTimestamp) / 1000, 0.05) || 0.016;
    const dtFactor = dtSec * 60;
    lastTimestamp = ts;

    AudioSys.updateBgm(dtSec);

    if (state.screen === 'splash') {
      drawSplash(dtSec);
    } else if (state.screen === 'cutscene') {
      drawCutscene(dtSec);
    } else if (state.screen === 'ending') {
      drawEnding(dtSec);
    } else if (state.screen === 'menu') {
      run.camX += 1.6 * dtFactor;
      run.anim += 0.14 * dtFactor;
      drawWorldBackground();
      drawExplorer(ctx, state.char, 190, GROUND_Y, run.anim, { scale: 1.15, facing: 1, moving: true, torchLit: true });
    } else if (state.screen === 'map') {
      drawWorldMap(dtSec);
    } else if (state.screen === 'play') {
      updateGameplay(dtFactor);
      drawWorldBackground();
      drawWorldEntities();
      drawRunnerHUD();
    } else if (state.screen === 'modal') {
      drawWorldBackground();
      drawWorldEntities();
      drawRunnerHUD();
    }

    requestAnimationFrame(frame);
  }

  window.__game = {
    skipToMenu: () => { AudioSys.sfxClick(); openMainMenu(); },
    advanceCutscene,
    replayIntro: () => { AudioSys.sfxClick(); startSplash(); },
    startEnding,
    showEndingCreditsModal,
    openMainMenu,
    startStory,
    openWorldMap,
    openHowToPlay,
    openExplorers,
    selectChar,
    openAchievements,
    openOptions,
    toggleSfx,
    toggleMusic,
    toggleTouch,
    toggleLang,
    resetProgress,
    prepareStage,
    launchRun,
    resumeRun,
    pauseRun,
    triggerCheckpointQuiz,
    answerQuiz
  };

  startSplash();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
