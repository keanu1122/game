<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lost Relics: Running Quest — Fun Dumb Creations</title>
<style>
  :root {
    --bg-outer: #0d071c;
    --border-purple: #7c4dff;
    --gold: #ffd740;
    --gold-dark: #b8860b;
    --panel-bg: rgba(22, 12, 48, 0.94);
    --text-main: #fff9e6;
    --text-sub: #cbb8ff;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1e1042 0%, var(--bg-outer) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    color: var(--text-main);
  }

  /* Responsive 16:9 widescreen arcade stage container */
  #stage {
    position: relative;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 0 3px #2e1963, 0 0 40px rgba(124, 77, 255, 0.45);
    border-radius: 10px;
    overflow: hidden;
    background: #140b2e;
    font-size: clamp(10px, 1.8vw, 16px);
  }

  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* Overlay UI Layer for Menus, Cutscene Controls, Map Cards & Quizzes */
  #ui {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.1em;
    pointer-events: none;
    z-index: 10;
  }

  #ui.active {
    display: flex;
    pointer-events: auto;
  }

  #ui.dim {
    background: rgba(13, 7, 30, 0.78);
    backdrop-filter: blur(2px);
  }

  /* Ornate Stone & Gem Pixel-Art Modal Frame */
  .stone-panel {
    position: relative;
    background: linear-gradient(180deg, #271754 0%, #170d36 100%);
    border: 4px solid #a78bfa;
    box-shadow:
      inset 0 0 0 3px #3b237a,
      0 0 0 4px #0e0722,
      0 14px 32px rgba(0, 0, 0, 0.75);
    border-radius: 12px;
    padding: 1.15em 1.7em;
    text-align: center;
    max-width: min(90%, 49em);
    max-height: 93%;
    overflow-y: auto;
    animation: popIn 0.2s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.93); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .stone-panel h1 {
    margin: 0;
    font-size: 3em;
    line-height: 0.96;
    letter-spacing: 0.04em;
    color: var(--gold);
    text-shadow: 0 3px 0 #b45309, 3px 4px 0 #6d28d9, 0 0 18px rgba(255, 215, 64, 0.45);
  }

  .stone-panel h2 {
    margin: 0.15em 0 0.45em;
    font-size: 1.5em;
    color: var(--gold);
    text-shadow: 2px 2px 0 #3b0764;
  }

  .subtitle {
    display: inline-block;
    margin-top: 0.35em;
    letter-spacing: 0.22em;
    font-size: 0.82em;
    font-weight: bold;
    color: #e9d5ff;
    background: rgba(124, 58, 237, 0.35);
    border: 1px solid #8b5cf6;
    padding: 0.22em 0.8em;
    border-radius: 6px;
  }

  .stone-panel p {
    margin: 0.45em 0;
    line-height: 1.42;
    font-size: 0.94em;
    color: #f3e8ff;
  }

  .badge-pill {
    display: inline-block;
    background: #321c70;
    border: 2px solid #ffd740;
    color: #ffd740;
    font-weight: bold;
    padding: 0.22em 0.8em;
    border-radius: 999px;
    font-size: 0.86em;
    margin: 0.2em 0;
  }

  /* Retro Beveled Arcade Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45em;
    margin: 0.32em;
    min-width: 13em;
    padding: 0.58em 1.1em;
    background: linear-gradient(180deg, #ffe57f 0%, #ffc400 100%);
    color: #1c0f42;
    border: 2px solid #fff59d;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #9a6700, 0 6px 12px rgba(0, 0, 0, 0.45);
    transition: transform 0.08s ease, filter 0.12s ease;
  }

  .btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #9a6700;
  }

  .btn.sec {
    background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
    color: #ffffff;
    border-color: #c4b5fd;
    box-shadow: 0 4px 0 #3b0764, 0 6px 12px rgba(0, 0, 0, 0.45);
  }

  .btn.sec:active {
    box-shadow: 0 1px 0 #3b0764;
  }

  .btn.wide {
    display: flex;
    width: min(100%, 22em);
    margin: 0.4em auto;
  }

  .btn.quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    margin: 0.42em 0;
    padding: 0.65em 1em;
    font-size: 0.92em;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.42em;
    margin-top: 0.75em;
  }

  .menu-grid .span-2 {
    grid-column: span 2;
  }

  /* Explorer Cards */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.9em;
    margin: 0.65em 0;
  }

  .char-card {
    background: rgba(17, 9, 41, 0.88);
    border: 2px solid #6d28d9;
    border-radius: 10px;
    padding: 0.7em;
    text-align: center;
    transition: border-color 0.15s, transform 0.15s;
  }

  .char-card.selected {
    border-color: #ffd740;
    box-shadow: 0 0 16px rgba(255, 215, 64, 0.35);
  }

  .char-card canvas {
    display: block;
    margin: 0 auto 0.35em;
    background: radial-gradient(circle, #311b70 0%, #160c36 75%);
    border: 2px solid #4c1d95;
    border-radius: 8px;
    image-rendering: pixelated;
  }

  .stat-row {
    font-size: 0.82em;
    color: #ffd740;
    margin: 0.22em 0;
    font-weight: bold;
  }

  /* Controls Grid in How-To-Play */
  .ctrl-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.45em;
    text-align: left;
    margin: 0.6em 0;
  }

  .ctrl-item {
    background: rgba(16, 9, 38, 0.85);
    border: 1px solid #5b21b6;
    border-radius: 8px;
    padding: 0.45em 0.65em;
    font-size: 0.84em;
  }

  .ctrl-key {
    color: #ffd740;
    font-weight: 900;
  }

  /* Floating Corner HUD Controls */
  #corner-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }

  .hud-btn {
    pointer-events: auto;
    position: absolute;
    background: rgba(24, 13, 54, 0.88);
    color: #ffd740;
    border: 2px solid #8b5cf6;
    border-radius: 8px;
    padding: 0.38em 0.78em;
    font-family: inherit;
    font-size: 0.86em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #0d0620;
  }

  .hud-btn:hover {
    background: #361d75;
    border-color: #ffd740;
  }

  /* Bottom Map Drawer Card */
  #map-drawer {
    position: absolute;
    left: 50%;
    bottom: 2.2%;
    transform: translateX(-50%);
    width: min(94%, 52em);
    background: rgba(20, 11, 46, 0.93);
    border: 3px solid #a78bfa;
    box-shadow: 0 0 0 3px #0c061f, 0 8px 24px rgba(0, 0, 0, 0.7);
    border-radius: 12px;
    padding: 0.6em 1.05em;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    pointer-events: auto;
    z-index: 9;
  }

  #map-drawer.visible {
    display: flex;
  }

  .map-info {
    text-align: left;
    flex: 1;
  }

  .map-info h3 {
    margin: 0;
    color: #ffd740;
    font-size: 1.12em;
  }

  .map-info p {
    margin: 0.2em 0 0;
    font-size: 0.84em;
    color: #e9d5ff;
    line-height: 1.3;
  }

  /* Responsive On-Screen Action Pads during Gameplay */
  .touch-cluster-left {
    pointer-events: auto;
    position: absolute;
    left: 14px;
    bottom: 12px;
    display: flex;
    gap: 8px;
  }

  .touch-cluster-right {
    pointer-events: auto;
    position: absolute;
    right: 14px;
    bottom: 12px;
    display: flex;
    gap: 8px;
  }

  .pad-btn {
    min-width: 3.3em;
    height: 3.1em;
    padding: 0 0.65em;
    border-radius: 10px;
    background: rgba(22, 12, 50, 0.62);
    border: 2px solid rgba(196, 181, 253, 0.55);
    color: #fff;
    font-family: inherit;
    font-weight: 900;
    font-size: 0.84em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(10, 5, 25, 0.7);
  }

  .pad-btn.gold {
    border-color: rgba(255, 215, 64, 0.75);
    color: #ffd740;
  }

  .pad-btn:active, .pad-btn.pressed {
    background: rgba(124, 58, 237, 0.82);
    transform: translateY(2px);
  }

  @media (max-width: 640px) {
    .char-grid, .menu-grid, .ctrl-grid { grid-template-columns: 1fr; }
    .menu-grid .span-2 { grid-column: span 1; }
    #map-drawer { flex-direction: column; text-align: center; padding: 0.55em 0.8em; }
    .map-info { text-align: center; }
  }
</style>
</head>

  // --------------------------------------------------------------------------
  // 4. RETRO 16-BIT WEB AUDIO CHIPTUNE ENGINE
  // --------------------------------------------------------------------------
  const AudioSys = {
    ctx: null,
    bgmTimer: 0,
    noteIdx: 0,

    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    },

    tone(freq, dur = 0.1, type = 'square', vol = 0.045, slideTo = null) {
      if (!state.sfx) return;
      this.ensure();
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      } catch (e) {}
    },

    sfxJump() { this.tone(340, 0.13, 'square', 0.045, 680); },
    sfxDoubleJump() { this.tone(520, 0.14, 'triangle', 0.06, 980); },
    sfxWallJump() { this.tone(420, 0.12, 'square', 0.05, 840); },
    sfxSlide() { this.tone(240, 0.11, 'triangle', 0.04, 130); },
    sfxDash() { this.tone(300, 0.15, 'sawtooth', 0.05, 920); },
    sfxSlam() { this.tone(180, 0.22, 'sawtooth', 0.065, 55); },
    sfxAction() { this.tone(480, 0.12, 'square', 0.05, 220); },
    sfxBounce() { this.tone(280, 0.22, 'sine', 0.07, 880); },
    sfxBoost() {
      this.tone(523, 0.08, 'square', 0.04);
      setTimeout(() => this.tone(784, 0.14, 'square', 0.045, 1046), 60);
    },
    sfxGem() {
      this.tone(880, 0.07, 'square', 0.045);
      setTimeout(() => this.tone(1318, 0.12, 'square', 0.045), 55);
    },
    sfxSmash() { this.tone(160, 0.16, 'sawtooth', 0.055, 65); },
    sfxHurt() { this.tone(175, 0.26, 'sawtooth', 0.06, 72); },
    sfxClick() { this.tone(660, 0.05, 'square', 0.03); },
    sfxCorrect() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => this.tone(f, 0.12, 'square', 0.045), i * 70);
      });
    },
    sfxRelic() {
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => this.tone(f, i === 5 ? 0.35 : 0.11, 'square', 0.05), i * 95);
      });
    },
    sfxFanfare() {
      [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5, 1318.5].forEach((f, i) => {
        setTimeout(() => this.tone(f, i === 6 ? 0.45 : 0.13, 'square', 0.05), i * 110);
      });
    },

    updateBgm(dt) {
      if (!state.music || !this.ctx || this.ctx.state !== 'running') return;
      if (state.screen === 'splash') return;

      const tempo = state.screen === 'play' ? 0.18 : (state.screen === 'ending' ? 0.24 : 0.28);
      this.bgmTimer += dt;
      if (this.bgmTimer < tempo) return;
      this.bgmTimer = 0;

      const melodies = {
        cutscene: [392, 0, 440, 523.25, 659.25, 0, 587.33, 523.25, 493.88, 0, 392, 440, 523.25, 0, 392, 0],
        ending:   [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5, 1318.5, 0, 1174.66, 1046.5, 880, 1046.5, 783.99, 880, 1046.5, 0],
        menu:     [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46, 523.25, 659.25, 783.99, 1046.5, 987.77, 783.99, 659.25, 0],
        map:      [440, 523.25, 659.25, 523.25, 493.88, 587.33, 783.99, 587.33, 523.25, 659.25, 880, 783.99, 659.25, 587.33, 523.25, 0],
        play:     [523.25, 523.25, 659.25, 783.99, 659.25, 783.99, 1046.5, 0, 880, 783.99, 659.25, 587.33, 659.25, 783.99, 659.25, 523.25]
      };

      const seq = melodies[state.screen] || melodies.menu;
      const freq = seq[this.noteIdx % seq.length];
      this.noteIdx++;

      if (freq > 0) {
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = state.screen === 'play' ? 'square' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.015, now);
          gain.gain.exponentialRampToValueAtTime(0.0005, now + tempo * 0.85);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + tempo * 0.88);
        } catch (e) {}
      }
    }
  };

  function pxRect(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  /**
   * Compiles an ASCII pixel matrix into a crisp offscreen pixel-art sprite canvas
   */
  function bakePixelGrid(rows, palette, scale = 2) {
    const h = rows.length;
    const w = rows[0].length;
    const c = document.createElement('canvas');
    c.width = w * scale;
    c.height = h * scale;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    for (let r = 0; r < h; r++) {
      const line = rows[r];
      for (let col = 0; col < w; col++) {
        const ch = line[col];
        if (ch !== '.' && palette[ch]) {
          g.fillStyle = palette[ch];
          g.fillRect(col * scale, r * scale, scale, scale);
        }
      }
    }
    return c;
  }

  /**
   * Renders Gearlock or Crag with crisp pixel sprites + dynamic animated props
   */
  function drawExplorer(g, type, x, y, animPhase, opts = {}) {
    const {
      sliding = false,
      crouching = false,
      dashing = false,
      slamming = false,
      wallSliding = false,
      actionTimer = 0,
      airBoostFlash = 0,
      celebrating = false,
      scale = 1,
      facing = 1,
      torchLit = true,
      moving = false
    } = opts;

    g.save();
    g.translate(Math.round(x), Math.round(y));

    const sx = scale * facing;
    const sy = sliding ? scale * 0.62 : scale;
    g.scale(sx, sy);

    const lowPose = sliding || crouching;
    const bob = celebrating
      ? Math.abs(Math.sin(animPhase * 3.2)) * 8
      : ((!lowPose && moving) ? Math.abs(Math.sin(animPhase * 2.2)) * 3 : 0);

    if (type === 'gear') {
      let sprite = GEAR_SPRITES.idle;
      if (lowPose) sprite = GEAR_SPRITES.crouch;
      else if (celebrating || slamming || dashing || airBoostFlash > 0) sprite = GEAR_SPRITES.jump;
      else if (moving) sprite = ((animPhase * 2.4) | 0) % 2 === 0 ? GEAR_SPRITES.run1 : GEAR_SPRITES.run2;

      if (airBoostFlash > 0 || dashing || slamming) {
        const fLen = 14 + (((animPhase * 12) | 0) % 8);
        pxRect(g, -24, -26, 10, fLen, '#ff5722');
        pxRect(g, -22, -26, 6, fLen - 5, '#ffd740');
      }

      g.drawImage(sprite, -28, -58 - bob);

      if (torchLit) {
        g.save();
        if (actionTimer > 0) {
          const swingProg = 1 - actionTimer / 14;
          g.translate(22, -26 - bob);
          g.rotate(-0.6 + swingProg * 1.9);
          pxRect(g, -2, -22, 5, 22, '#5c3618');
          pxRect(g, -6, -38, 14, 18, '#ff6d00');
          pxRect(g, -3, -34, 8, 12, '#ffd740');
          g.fillStyle = 'rgba(255, 145, 0, 0.55)';
          g.beginPath();
          g.arc(0, -14, 34, -0.8, 0.9);
          g.lineTo(0, -14);
          g.fill();
        } else {
          const tx = lowPose ? 24 : 23;
          const ty = lowPose ? -22 : (celebrating ? -46 - bob : -36 - bob);
          pxRect(g, tx, ty, 5, 16, '#5c3618');
          pxRect(g, tx - 1, ty - 2, 7, 3, '#8d5524');
          const flick = ((animPhase * 6) | 0) % 3;
          pxRect(g, tx - 3, ty - 14 - flick, 11, 12 + flick, '#ff5722');
          pxRect(g, tx - 1, ty - 11 - (flick % 2), 7, 9, '#ffca28');
          pxRect(g, tx + 1, ty - 7, 3, 5, '#ffffff');
        }
        g.restore();
      }
    } else {
      let sprite = CRAG_SPRITES.idle;
      if (lowPose) sprite = CRAG_SPRITES.crouch;
      else if (moving || dashing || slamming) {
        sprite = ((animPhase * 2.1) | 0) % 2 === 0 ? CRAG_SPRITES.run1 : CRAG_SPRITES.run2;
      }

      if (moving || dashing || slamming || wallSliding || celebrating) {
        const wave = Math.sin(animPhase * 4) * 3;
        pxRect(g, -28, -42 - bob, 14, 6, '#1d4ed8');
        pxRect(g, -36, -40 - bob + wave, 12, 5, '#3b82f6');
        pxRect(g, -32, -35 - bob - wave, 10, 4, '#1e3a8a');
      }

      g.drawImage(sprite, -32, -60 - bob);

      g.save();
      const px = lowPose ? 22 : 24;
      const py = lowPose ? -18 : (celebrating ? -36 - bob : -26 - bob);
      g.translate(px, py);
      if (actionTimer > 0) {
        const swingProg = 1 - actionTimer / 14;
        g.rotate(-1.1 + swingProg * 2.3);
        g.fillStyle = 'rgba(192, 132, 252, 0.45)';
        g.beginPath();
        g.arc(0, -10, 38, -0.7, 0.9);
        g.lineTo(0, -10);
        g.fill();
      } else if (slamming) {
        g.rotate(2.4);
      } else if (celebrating) {
        g.rotate(-0.65 + Math.sin(animPhase * 5) * 0.25);
      } else {
        g.rotate(-0.25 + Math.sin(animPhase * 2) * 0.08);
      }
      pxRect(g, -2, -24, 4, 30, '#7c4a27');
      pxRect(g, -1, -24, 2, 30, '#a66838');
      pxRect(g, -12, -26, 24, 4, '#cbd5e1');
      pxRect(g, -15, -23, 5, 4, '#94a3b8');
      pxRect(g, 10, -23, 5, 4, '#94a3b8');
      pxRect(g, -3, -27, 6, 6, '#64748b');
      g.restore();
    }

    g.restore();
  }

  /**
   * Renders the "FUN DUMB CREATIONS" Metallic Silver Brain + Golden D-Pad Emblem
   */
  function drawStudioLogo(g, cx, cy, scale = 1, shimmerPhase = 0) {
    g.save();
    g.translate(cx, cy);
    g.scale(scale, scale);

    const silverBase = '#c4c7ce';
    const silverLight = '#f1f3f7';
    const silverDark = '#757982';
    const outline = '#09090d';

    pxRect(g, -68, -76, 136, 134, outline);
    pxRect(g, -82, -52, 164, 92, outline);
    pxRect(g, -54, -92, 108, 160, outline);

    pxRect(g, -62, -70, 124, 122, silverBase);
    pxRect(g, -76, -46, 152, 80, silverBase);
    pxRect(g, -48, -86, 96, 148, silverBase);

    pxRect(g, -44, -82, 88, 12, silverLight);
    pxRect(g, -72, -44, 14, 48, silverLight);

    pxRect(g, -46, 52, 92, 10, silverDark);
    pxRect(g, -3, 18, 6, 46, outline);
    pxRect(g, -56, -8, 22, 6, outline);
    pxRect(g, 34, -8, 22, 6, outline);
    pxRect(g, -46, 22, 24, 6, outline);
    pxRect(g, 22, 22, 24, 6, outline);

    pxRect(g, -22, -74, 44, 106, outline);
    pxRect(g, -54, -42, 108, 42, outline);

    const goldMain = '#d6b46c';
    const goldHi = '#f7e1a0';
    const goldShadow = '#8c6d32';

    const drawPadBtn = (bx, by, bw, bh, arrowDir) => {
      pxRect(g, bx, by, bw, bh, goldMain);
      pxRect(g, bx, by, bw, 4, goldHi);
      pxRect(g, bx, by + bh - 4, bw, 4, goldShadow);
      g.fillStyle = outline;
      g.beginPath();
      const mx = bx + bw / 2, my = by + bh / 2;
      if (arrowDir === 'U') { g.moveTo(mx, my - 6); g.lineTo(mx - 6, my + 4); g.lineTo(mx + 6, my + 4); }
      if (arrowDir === 'D') { g.moveTo(mx, my + 6); g.lineTo(mx - 6, my - 4); g.lineTo(mx + 6, my - 4); }
      if (arrowDir === 'L') { g.moveTo(mx - 6, my); g.lineTo(mx + 4, my - 6); g.lineTo(mx + 4, my + 6); }
      if (arrowDir === 'R') { g.moveTo(mx + 6, my); g.lineTo(mx - 4, my - 6); g.lineTo(mx - 4, my + 6); }
      g.fill();
    };

    drawPadBtn(-14, -68, 28, 30, 'U');
    drawPadBtn(-14, -4, 28, 30, 'D');
    drawPadBtn(-48, -35, 30, 28, 'L');
    drawPadBtn(18, -35, 30, 28, 'R');

    if (shimmerPhase > 0) {
      const sx = -90 + ((shimmerPhase * 220) % 240);
      g.save();
      g.beginPath();
      g.rect(-76, -86, 152, 148);
      g.clip();
      g.fillStyle = 'rgba(255, 255, 255, 0.26)';
      g.fillRect(sx, -90, 18, 160);
      g.restore();
    }

    g.textAlign = 'center';
    g.font = '900 34px "Courier New", monospace';
    g.fillStyle = '#09090d';
    g.fillText('FUN DUMB', 3, 108);
    g.fillStyle = '#e5e7eb';
    g.fillText('FUN DUMB', 0, 105);

    pxRect(g, -135, 116, 270, 6, goldMain);
    pxRect(g, -135, 116, 270, 2, goldHi);
    pxRect(g, -148, 114, 5, 5, goldMain);
    pxRect(g, -142, 119, 5, 5, goldMain);
    pxRect(g, 138, 114, 5, 5, goldMain);
    pxRect(g, 144, 119, 5, 5, goldMain);

    g.font = 'bold 24px "Courier New", monospace';
    g.fillStyle = '#9ca3af';
    g.fillText('C R E A T I O N S', 0, 146);

    g.restore();
  }

  function drawCrystalFragment(g, x, y, phase = 0) {
    const bobY = y + Math.sin(phase + x * 0.02) * 5;
    g.save();
    g.translate(x, bobY);
    g.fillStyle = 'rgba(192, 132, 252, 0.28)';
    g.beginPath();
    g.arc(0, 0, 17, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = '#a855f7';
    g.beginPath();
    g.moveTo(0, -15);
    g.lineTo(11, 0);
    g.lineTo(0, 15);
    g.lineTo(-11, 0);
    g.closePath();
    g.fill();

    g.fillStyle = '#f3e8ff';
    g.beginPath();
    g.moveTo(0, -11);
    g.lineTo(5, -2);
    g.lineTo(0, 4);
    g.lineTo(-5, -2);
    g.closePath();
    g.fill();
    g.restore();
  }

  // --------------------------------------------------------------------------
  // 6. SPLASH SCREEN, OPENING CUTSCENE & 4-SCENE ENDING SEQUENCE
  // --------------------------------------------------------------------------
  function startSplash() {
    state.screen = 'splash';
    state.splashTimer = 0;
    uiEl.classList.remove('active', 'dim');
    mapDrawerEl.classList.remove('visible');
    cornerEl.innerHTML = '';
  }

  function startCutscene() {
    state.screen = 'cutscene';
    state.cutSceneIdx = 0;
    state.cutTimer = 0;
    uiEl.classList.remove('active', 'dim');
    mapDrawerEl.classList.remove('visible');
    renderCutsceneControls();
  }

  function renderCutsceneControls() {
    cornerEl.innerHTML = `
      <button class="hud-btn" style="top:14px; right:16px;" onclick="window.__game.skipToMenu()">${T('skip')}</button>
      <button class="hud-btn" style="bottom:14px; right:16px;" onclick="window.__game.advanceCutscene()">${T('next')}</button>
    `;
  }

  function advanceCutscene() {
    AudioSys.sfxClick();
    if (state.screen === 'splash') {
      startCutscene();
      return;
    }
    if (state.screen === 'cutscene') {
      state.cutSceneIdx++;
      state.cutTimer = 0;
      if (state.cutSceneIdx >= 3) openMainMenu();
      return;
    }
    if (state.screen === 'ending') {
      state.endingIdx++;
      state.endingTimer = 0;
      if (state.endingIdx >= 4) showEndingCreditsModal();
    }
  }

  function startEnding() {
    AudioSys.sfxFanfare();
    state.screen = 'ending';
    state.endingIdx = 0;
    state.endingTimer = 0;
    state.endingFireworks = [];
    uiEl.classList.remove('active', 'dim');
    mapDrawerEl.classList.remove('visible');
    cornerEl.innerHTML = `
      <button class="hud-btn" style="top:14px; right:16px;" onclick="window.__game.showEndingCreditsModal()">${T('skip')}</button>
      <button class="hud-btn" style="bottom:14px; right:16px;" onclick="window.__game.advanceCutscene()">${T('next')}</button>
    `;
  }

  function showEndingCreditsModal() {
    AudioSys.sfxClick();
    state.screen = 'modal';
    cornerEl.innerHTML = '';
    mapDrawerEl.classList.remove('visible');
    uiEl.classList.add('active', 'dim');

    uiEl.innerHTML = `
      <div class="stone-panel">
        <div class="badge-pill">★ ${T('endingCreditsSub')} ★</div>
        <h2>${T('endingCreditsTitle')}</h2>
        <p>${T('endingCreditsBody')}</p>
        <div style="margin:0.55em 0;font-size:0.88em;color:#ffd740;font-weight:bold;">
          🏆 ${T('achievements')}: ${Object.keys(state.ach).length} / 5
        </div>
        <button class="btn wide" onclick="window.__game.startEnding()">${T('replayEnding')}</button>
        <button class="btn sec wide" onclick="window.__game.openWorldMap()">${T('worldMap')}</button>
        <button class="btn sec wide" onclick="window.__game.openMainMenu()">${T('mainMenu')}</button>
      </div>
    `;
  }

  function spawnEndingFirework() {
    const colors = ['#ffd740', '#e040fb', '#00e5ff', '#ff5252', '#69f0ae'];
    const cx = 140 + Math.random() * (W - 280);
    const cy = 70 + Math.random() * 190;
    const col = colors[(Math.random() * colors.length) | 0];
    for (let i = 0; i < 22; i++) {
      const ang = (i * Math.PI * 2) / 22;
      const spd = 1.5 + Math.random() * 3.5;
      state.endingFireworks.push({
        x: cx,
        y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1.1 + Math.random() * 0.5,
        color: col
      });
    }
  }

  function drawEnding(dt) {
    state.endingTimer += dt;
    const idx = state.endingIdx;

    if (idx === 0) {
      // ENDING SCENE 1: Back at the Ancient Ruin Pedestal — All 5 Golden Relics Restored!
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1c1038');
      grad.addColorStop(1, '#3b206e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      pxRect(ctx, 80, 60, 800, 360, '#33274d');
      pxRect(ctx, 130, 95, 700, 325, '#201638');
      for (let i = 0; i < 14; i++) {
        pxRect(ctx, 150 + i * 50, 95, 14, 24 + (i % 3) * 18, '#4caf50');
      }
      pxRect(ctx, 0, 415, W, 125, '#3f3754');
      pxRect(ctx, 0, 415, W, 10, '#66bb6a');

      const aura = ctx.createRadialGradient(480, 280, 15, 480, 280, 260);
      aura.addColorStop(0, 'rgba(255, 215, 64, 0.55)');
      aura.addColorStop(0.6, 'rgba(168, 85, 247, 0.22)');
      aura.addColorStop(1, 'rgba(255, 215, 64, 0)');
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, W, H);

      // Stone Pedestal & Central Golden Running Shoe Relic
      pxRect(ctx, 435, 345, 90, 70, '#675e85');
      pxRect(ctx, 425, 335, 110, 14, '#8d83b0');
      drawGoldenRelic(ctx, 480, 298, state.endingTimer * 3, 1.25);

      // Orbiting 5 Golden Relics & 5 Crystal Fragments
      for (let i = 0; i < 5; i++) {
        const ang = (i * Math.PI * 2) / 5 + state.endingTimer * 1.1;
        drawGoldenRelic(ctx, 480 + Math.cos(ang) * 95, 225 + Math.sin(ang) * 38, state.endingTimer * 3 + i, 0.65);
        drawCrystalFragment(ctx, 480 + Math.cos(-ang) * 55, 225 + Math.sin(-ang) * 22, state.endingTimer * 4 + i);
      }

      drawExplorer(ctx, 'gear', 310, 415, state.endingTimer * 2.5, { scale: 1.55, facing: 1, celebrating: true, torchLit: true });
      drawExplorer(ctx, 'crag', 650, 415, state.endingTimer * 2.2, { scale: 1.55, facing: -1, celebrating: true });
    } else if (idx === 1) {
      // ENDING SCENE 2: Golden Energy Beams Reconnect & Restore All 5 Sky Islands!
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#2a155c');
      grad.addColorStop(0.5, '#5e35b1');
      grad.addColorStop(1, '#311b92');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#fff9c4';
      for (let i = 0; i < 55; i++) {
        const sx = (i * 197) % W;
        const sy = (i * 89) % (H - 120);
        ctx.fillRect(sx, sy, 3, 3);
      }

      // Golden sky ring connecting all 5 floating islands
      ctx.strokeStyle = 'rgba(255, 215, 64, 0.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      WORLDS.forEach((w, i) => {
        const ix = 140 + i * 170;
        const iy = 185 + (i % 2) * 50;
        if (i === 0) ctx.moveTo(ix, iy);
        else ctx.lineTo(ix, iy);
      });
      ctx.stroke();

      WORLDS.forEach((w, i) => {
        const ix = 140 + i * 170;
        const iy = 185 + (i % 2) * 50;
        drawMiniIslandIcon(ctx, ix, iy, i, 0.78);
        drawGoldenRelic(ctx, ix, iy - 42, state.endingTimer * 3 + i, 0.72);
      });
    } else if (idx === 2) {
      // ENDING SCENE 3: Champions of the Sky Track Victory Celebration!
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#3b7ddd');
      grad.addColorStop(1, '#cde6ff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Sky Stadium podium & banners
      pxRect(ctx, 0, 415, W, 125, '#e3dcff');
      pxRect(ctx, 0, 415, W, 12, '#9582e8');
      pxRect(ctx, 350, 355, 260, 60, '#7e57c2');
      pxRect(ctx, 340, 345, 280, 12, '#ffd740');

      // Falling celebratory confetti
      const confColors = ['#ffd740', '#ff4081', '#00e5ff', '#7c4dff', '#69f0ae'];
      for (let i = 0; i < 48; i++) {
        const cx = (i * 83 + Math.sin(state.endingTimer * 2 + i) * 28) % W;
        const cy = ((i * 47 + state.endingTimer * 120) % (H - 95));
        pxRect(ctx, cx, cy, 7, 5, confColors[i % confColors.length]);
      }

      drawGoldenRelic(ctx, 480, 290, state.endingTimer * 4, 1.35);
      drawExplorer(ctx, 'gear', 415, 345, state.endingTimer * 3.5, { scale: 1.5, facing: 1, celebrating: true, torchLit: true });
      drawExplorer(ctx, 'crag', 545, 345, state.endingTimer * 3.2, { scale: 1.5, facing: -1, celebrating: true });
    } else {
      // ENDING SCENE 4: Fireworks & Fun Dumb Creations Finale Banner
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#120829');
      grad.addColorStop(1, '#2c155e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      if (Math.random() < 0.08) spawnEndingFirework();
      for (let i = state.endingFireworks.length - 1; i >= 0; i--) {
        const fw = state.endingFireworks[i];
        fw.x += fw.vx;
        fw.y += fw.vy;
        fw.vy += 0.04;
        fw.life -= dt;
        if (fw.life <= 0) {
          state.endingFireworks.splice(i, 1);
        } else {
          pxRect(ctx, fw.x, fw.y, 4, 4, fw.color);
        }
      }

      drawStudioLogo(ctx, W / 2, 165, 0.78, state.endingTimer);
      drawExplorer(ctx, 'gear', 250, 385, state.endingTimer * 3, { scale: 1.45, facing: 1, celebrating: true, torchLit: true });
      drawExplorer(ctx, 'crag', 710, 385, state.endingTimer * 2.8, { scale: 1.45, facing: -1, celebrating: true });
      drawGoldenRelic(ctx, W / 2, 338, state.endingTimer * 3.5, 1.25);
    }

    // Caption Box at Bottom
    pxRect(ctx, 70, H - 96, W - 140, 74, 'rgba(17, 9, 41, 0.92)');
    ctx.strokeStyle = '#ffd740';
    ctx.lineWidth = 3;
    ctx.strokeRect(70, H - 96, W - 140, 74);

    ctx.fillStyle = '#fff9e6';
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.textAlign = 'center';
    wrapCanvasText(ctx, T('endingScenes')[idx], W / 2, H - 64, W - 190, 23);

    if (state.endingTimer >= 4.8) advanceCutscene();
  }

  function drawSplash(dt) {
    state.splashTimer += dt;
    ctx.fillStyle = '#141418';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 2;
    for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    const alpha = Math.min(1, state.splashTimer / 0.6);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawStudioLogo(ctx, W / 2, H / 2 - 24, 1.15, state.splashTimer);
    ctx.fillStyle = '#a78bfa';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(T('studioSub'), W / 2, H - 56);
    ctx.restore();

    if (state.splashTimer >= 3.2) startCutscene();
  }

  function drawCutscene(dt) {
    state.cutTimer += dt;
    const idx = state.cutSceneIdx;

    if (idx === 0) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#140c24');
      grad.addColorStop(1, '#26173d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      pxRect(ctx, 80, 60, 800, 360, '#2e2442');
      pxRect(ctx, 130, 95, 700, 325, '#1b132b');
      for (let i = 0; i < 14; i++) {
        pxRect(ctx, 150 + i * 50, 95, 14, 24 + (i % 3) * 18, '#388e3c');
      }
      pxRect(ctx, 0, 415, W, 125, '#37304a');
      pxRect(ctx, 0, 415, W, 10, '#4caf50');

      const torchGlow = ctx.createRadialGradient(310, 340, 10, 310, 340, 220);
      torchGlow.addColorStop(0, 'rgba(255, 183, 77, 0.35)');
      torchGlow.addColorStop(1, 'rgba(255, 183, 77, 0)');
      ctx.fillStyle = torchGlow;
      ctx.fillRect(0, 0, W, H);

      pxRect(ctx, 435, 345, 90, 70, '#5a5275');
      pxRect(ctx, 425, 335, 110, 14, '#7e759e');
      drawGoldenRelic(ctx, 480, 302, state.cutTimer * 2, 1.15);

      ctx.strokeStyle = 'rgba(192, 132, 252, 0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(480, 200, 56 + Math.sin(state.cutTimer * 3) * 4, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const ang = (i * Math.PI * 2) / 5 + state.cutTimer * 0.6;
        drawCrystalFragment(ctx, 480 + Math.cos(ang) * 42, 200 + Math.sin(ang) * 26, state.cutTimer * 3 + i);
      }

      drawExplorer(ctx, 'gear', 295, 415, state.cutTimer * 2, { scale: 1.55, facing: 1, torchLit: true });
      drawExplorer(ctx, 'crag', 665, 415, state.cutTimer * 1.5, { scale: 1.55, facing: -1 });
    } else if (idx === 1) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#220f4a');
      grad.addColorStop(1, '#582c9e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#fff9c4';
      for (let i = 0; i < 45; i++) {
        const sx = (i * 197) % W;
        const sy = (i * 89) % (H - 120);
        const sz = ((i + (state.cutTimer * 3 | 0)) % 3 === 0) ? 4 : 2;
        ctx.fillRect(sx, sy, sz, sz);
      }

      const prog = Math.min(1, state.cutTimer / 2.2);
      WORLDS.forEach((w, i) => {
        const ix = 140 + i * 170;
        const iy = 180 + (i % 2) * 55;
        drawMiniIslandIcon(ctx, ix, iy, i, 0.72);

        ctx.strokeStyle = i % 2 === 0 ? '#ffd740' : '#e040fb';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(W / 2, H - 60);
        ctx.lineTo(
          W / 2 + (ix - W / 2) * prog,
          (H - 60) + (iy - 24 - (H - 60)) * prog
        );
        ctx.stroke();

        if (prog > 0.85) {
          drawGoldenRelic(ctx, ix, iy - 36, state.cutTimer * 3 + i, 0.68);
        }
      });
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#2d165e');
      grad.addColorStop(1, '#7c4dff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#fff';
      for (let i = 0; i < 35; i++) ctx.fillRect((i * 173) % W, (i * 67) % 300, 3, 3);

      pxRect(ctx, 370, 150, 220, 270, '#5c527a');
      pxRect(ctx, 405, 185, 150, 235, '#190d38');
      const pGlow = ctx.createRadialGradient(480, 300, 10, 480, 300, 110);
      pGlow.addColorStop(0, '#ffd740');
      pGlow.addColorStop(0.5, '#c084fc');
      pGlow.addColorStop(1, 'rgba(124, 77, 255, 0)');
      ctx.fillStyle = pGlow;
      ctx.fillRect(405, 185, 150, 235);

      pxRect(ctx, 0, 420, W, 120, '#3a8f3a');
      pxRect(ctx, 0, 434, W, 106, '#6d4c41');

      const runX = 180 + Math.min(250, state.cutTimer * 85);
      drawExplorer(ctx, 'crag', runX - 60, 420, state.cutTimer * 4, { scale: 1.45, facing: 1, moving: true });
      drawExplorer(ctx, 'gear', runX + 24, 420, state.cutTimer * 4.5, { scale: 1.45, facing: 1, moving: true, torchLit: true });

      ctx.textAlign = 'center';
      ctx.font = '900 44px "Courier New", monospace';
      ctx.fillStyle = '#3b0764';
      ctx.fillText('LOST RELICS: RUNNING QUEST', W / 2 + 4, 84);
      ctx.fillStyle = '#ffd740';
      ctx.fillText('LOST RELICS: RUNNING QUEST', W / 2, 80);
    }

    pxRect(ctx, 70, H - 96, W - 140, 74, 'rgba(17, 9, 41, 0.92)');
    ctx.strokeStyle = '#ffd740';
    ctx.lineWidth = 3;
    ctx.strokeRect(70, H - 96, W - 140, 74);

    ctx.fillStyle = '#fff9e6';
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.textAlign = 'center';
    wrapCanvasText(ctx, T('cutscene')[idx], W / 2, H - 64, W - 190, 23);

    if (state.cutTimer >= 4.6) advanceCutscene();
  }

  function wrapCanvasText(g, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let curY = y;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + ' ';
      if (g.measureText(test).width > maxWidth && i > 0) {
        g.fillText(line.trim(), x, curY);
        line = words[i] + ' ';
        curY += lineHeight;
      } else {
        line = test;
      }
    }
    g.fillText(line.trim(), x, curY);
  }

  function startStory() {

    state.selectedWorld = Math.min(state.unlockedWorld, 4);

  function openWorldMap() {
    AudioSys.sfxClick();
    state.screen = 'map';

    const w = WORLDS[state.selectedWorld];

    mapDrawerEl.classList.add('visible');
    mapDrawerEl.innerHTML = `
      <div class="map-info">
        <h3>${state.selectedWorld + 1}. ${w.name} ${claimed ? `<span class="badge-pill">${T('relicClaimedTag')}</span>` : ''}</h3>

  function selectIslandOnMap(idx) {
    if (idx > state.unlockedWorld) {
      AudioSys.sfxHurt();
      state.selectedWorld = idx;
      updateMapDrawer();

    AudioSys.sfxClick();
    state.selectedWorld = idx;
    state.mapTargetX = WORLDS[idx].mapPos.x;
    state.mapTargetY = WORLDS[idx].mapPos.y - 26;
    updateMapDrawer();
  }

  function drawMiniIslandIcon(g, cx, cy, worldIdx, scale = 1) {
    g.save();
    g.translate(cx, cy);
    g.scale(scale, scale);

    g.fillStyle = '#4c3278';
    g.beginPath();
    g.moveTo(-64, 8);
    g.lineTo(64, 8);
    g.lineTo(18, 56);
    g.lineTo(-14, 52);
    g.closePath();
    g.fill();

    g.fillStyle = '#6b499e';
    g.beginPath();
    g.moveTo(-58, 8);
    g.lineTo(0, 8);
    g.lineTo(-8, 48);
    g.closePath();
    g.fill();

    if (worldIdx === 0) {
      pxRect(g, -64, -4, 128, 14, '#4caf50');
      pxRect(g, -42, -34, 10, 30, '#9e9e9e');
      pxRect(g, -18, -38, 10, 34, '#bdbdbd');
      pxRect(g, -44, -40, 38, 8, '#cfd8dc');
      pxRect(g, 24, -26, 22, 18, '#2e7d32');
      pxRect(g, 32, -10, 6, 8, '#6d4c41');
      pxRect(g, -18, 8, 12, 34, '#4fc3f7');
    } else if (worldIdx === 1) {
      pxRect(g, -64, -4, 128, 14, '#c89d66');
      pxRect(g, -42, -38, 22, 34, '#d9b382');
      pxRect(g, -14, -48, 28, 44, '#e6c598');
      pxRect(g, 20, -34, 22, 30, '#c89d66');
      pxRect(g, -48, -32, 8, 16, '#7c3aed');
      pxRect(g, 42, -32, 8, 16, '#ef4444');
    } else if (worldIdx === 2) {
      pxRect(g, -64, -4, 128, 14, '#e3f2fd');
      g.fillStyle = '#90a4ae';
      g.beginPath(); g.moveTo(-54, -4); g.lineTo(-4, -56); g.lineTo(48, -4); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.moveTo(-28, -30); g.lineTo(-4, -56); g.lineTo(20, -30); g.fill();
      pxRect(g, -14, -22, 26, 18, '#1e293b');
      pxRect(g, -6, -18, 10, 14, '#00e5ff');
    } else if (worldIdx === 3) {
      pxRect(g, -64, -4, 128, 14, '#e6a15c');
      pxRect(g, -46, -34, 26, 30, '#c85a32');
      pxRect(g, 18, -38, 28, 34, '#d96b38');
      pxRect(g, -12, -22, 6, 18, '#2e7d32');
      pxRect(g, 46, -20, 6, 16, '#2e7d32');
    } else {
      pxRect(g, -64, -4, 128, 14, '#d4c8f0');
      pxRect(g, -44, -34, 88, 30, '#e6c280');
      for (let c = -36; c <= 32; c += 14) pxRect(g, c, -30, 5, 22, '#6d4c41');
      pxRect(g, -22, -44, 44, 10, '#ffe082');
      pxRect(g, -18, 2, 46, 10, '#29b6f6');
    }

    g.restore();
  }

  function drawWorldMap(dt) {
    state.mapPulse += dt * 3;

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#361c69');
    grad.addColorStop(0.5, '#543096');
    grad.addColorStop(1, '#3b1f73');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff9c4';
    for (let i = 0; i < 65; i++) {
      const sx = (i * 157 + 31) % W;
      const sy = (i * 97 + 19) % H;
      const sz = ((i + (state.mapPulse | 0)) % 4 === 0) ? 4 : 2;
      ctx.fillRect(sx, sy, sz, sz);
    }

    ctx.fillStyle = '#7e57c2';
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.arc(i * 68, 14, 46, 0, Math.PI * 2);
      ctx.arc(i * 68, H - 10, 50, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#9575cd';
    for (let i = 0; i < 10; i++) {
      ctx.beginPath();
      ctx.arc(12, i * 62, 44, 0, Math.PI * 2);
      ctx.arc(W - 12, i * 62, 44, 0, Math.PI * 2);
      ctx.fill();
    }

    const archX = 480, archY = 266;
    pxRect(ctx, archX - 34, archY - 38, 14, 52, '#78718c');
    pxRect(ctx, archX + 20, archY - 38, 14, 52, '#78718c');
    pxRect(ctx, archX - 38, archY - 48, 76, 14, '#948da8');
    pxRect(ctx, archX - 42, archY + 12, 84, 8, '#57506b');

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.82)';
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 7]);
    ctx.beginPath();
    ctx.moveTo(112, 278);
    WORLDS.forEach(w => ctx.lineTo(w.mapPos.x, w.mapPos.y));
    ctx.stroke();
    ctx.restore();

    drawStar(ctx, 112, 278, 5, 16, 7, '#fff59d', '#ffd740');

    WORLDS.forEach((w, idx) => {
      const { x, y } = w.mapPos;
      const unlocked = idx <= state.unlockedWorld;
      const isSelected = idx === state.selectedWorld;
      const claimed = state.relics.includes(idx);

      ctx.save();
      if (!unlocked) ctx.filter = 'brightness(0.55) saturate(0.5)';
      drawMiniIslandIcon(ctx, x, y, idx, isSelected ? 1.07 : 0.96);
      ctx.restore();

      const nodeY = y + 6;
      const glowR = isSelected ? 18 + Math.sin(state.mapPulse * 2) * 3 : 14;
      ctx.fillStyle = isSelected ? 'rgba(255, 215, 64, 0.35)' : 'rgba(192, 132, 252, 0.25)';
      ctx.beginPath();
      ctx.arc(x, nodeY, glowR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = claimed ? '#ffd740' : '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(x, nodeY, 14, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = unlocked ? '#a855f7' : '#4b5563';
      ctx.beginPath();
      ctx.ellipse(x, nodeY - 1, 10, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      if (unlocked) {
        ctx.fillStyle = '#f3e8ff';
        ctx.fillRect(x - 3, nodeY - 3, 4, 2);
      }

      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#140b2e';
      ctx.fillText(`${idx + 1}. ${w.name}`, x + 1, y - 56);
      ctx.fillStyle = isSelected ? '#ffd740' : '#ffffff';
      ctx.fillText(`${idx + 1}. ${w.name}`, x, y - 57);

      if (claimed) {
        drawGoldenRelic(ctx, x + 46, y - 44, state.mapPulse + idx, 0.55);
      }
    });

    const dx = state.mapTargetX - state.mapExplorerX;
    state.mapExplorerX += dx * Math.min(1, dt * 6);
    state.mapExplorerY += (state.mapTargetY - state.mapExplorerY) * Math.min(1, dt * 6);
    drawExplorer(ctx, state.char, state.mapExplorerX, state.mapExplorerY, state.mapPulse * 2.5, {
      scale: 0.78,
      facing: dx < -1 ? -1 : 1,
      moving: Math.abs(dx) > 2,
      torchLit: true
    });
  }

  function drawStar(g, cx, cy, spikes, outerR, innerR, fill, stroke) {
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;
    g.beginPath();
    g.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      g.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      g.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    g.closePath();
    g.fillStyle = fill;
    g.fill();
    g.strokeStyle = stroke;
    g.lineWidth = 2;
    g.stroke();
  }

      run.items.push({ type: 'drone', x: f3 - 30 });
      run.items.push({ type: 'frag', x: f3, y: GROUND_Y - 34 });

      run.blocks.push({ x: f4 - 120, y: GROUND_Y - 170, w: 36, h: 170, style: 'ice' });
